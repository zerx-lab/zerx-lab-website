# ============================================================================
# Daily Tech News - 每日技术资讯自动发布(Markdown + git push 版)
# ----------------------------------------------------------------------------
# 流程:
#   1. 每天北京时间 07:00 (UTC 23:00 前一天) 触发,也支持手动触发
#   2. Calculate date: 计算"昨天"(北京时间),作为搜索目标日期
#   3. Run Claude Code: 调 claude-code-action 执行 .claude/skills/daily-tech-news
#      skill,让 Claude:
#        · Glob + Read 仓库内近 7 天的 daily-tech-news-* 文章做去重基线
#        · WebSearch + WebFetch 多源搜集资讯
#        · 交叉验证 + 重要性评分 + Top 3 深度分析
#        · 用 Write 把中英双语正文直接写成仓库内两个 Markdown 文件
#   4. Verify: 纯 shell 校验产物文件是否存在、frontmatter 是否完整、
#      正文是否够长、是否残留占位符 —— 任一项不过,直接 fail,后续
#      提交 / 部署 / 发信 job 都不会执行
#   5. Commit & push: 校验通过才 `git add` + commit + push 到 main
#   6. deploy job: 复用 deploy.yml(reusable workflow)把新文章构建并发布到 Pages
#   7. notify job: 站点真的上线之后,才通过 SMTP 发邮件通知订阅者
#
# 为什么 deploy 要显式 `uses: ./.github/workflows/deploy.yml`:
#   GitHub 明确禁止用默认 GITHUB_TOKEN 推送触发新的 workflow(防递归)。
#   所以 push 到 main **不会**自动跑 deploy.yml。这里把 deploy 作为可复用
#   workflow 直接调用,既避免额外配 PAT,又保证「发信时站点已经是新的」。
#
# 身份与权限:
#   - Claude Code 用 CLAUDE_CODE_OAUTH_TOKEN 驱动 WebSearch / WebFetch / 文件读写
#   - git push 用 GITHUB_TOKEN(job 级 `contents: write` 权限自带),
#     提交者身份固定为 github-actions[bot]
#
# 必需的 GitHub Secrets(敏感,值不可见):
#   - CLAUDE_CODE_OAUTH_TOKEN — Claude Code Action 授权 (本地 `claude setup-token`)
#   - SMTP_USER / SMTP_PASS   — 发信邮箱账号与授权码
#
# 必需的 GitHub Variables(非敏感,值可见可改):
#   - SMTP_HOST / SMTP_PORT   — 发信服务器,如 smtp.163.com / 465
#   - MAIL_FROM               — 发件地址(163 要求与 SMTP_USER 一致)
#   - MAIL_TO                 — 收件人,逗号分隔;加订阅者只改这一个变量
#
# 可选变量:
#   - 手动触发时可通过 inputs.date 指定目标日期 (YYYY-MM-DD),留空则用昨天
# ============================================================================

name: Daily Tech News

on:
  schedule:
    # 每天北京时间 07:00 执行 = UTC 23:00 前一天
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "指定搜索日期 (YYYY-MM-DD),留空则使用北京时间昨天"
        required: false
        type: string

concurrency:
  # 同一天只跑一次,防止手动触发 + schedule 撞车时并发写同一份文件 / 重复推送
  group: daily-tech-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # 下游 deploy / notify job 需要的全部信息
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      sha: ${{ steps.commit.outputs.sha }}
      slug: ${{ steps.verify.outputs.slug }}
      target_date: ${{ steps.date.outputs.target_date }}
      title: ${{ steps.verify.outputs.title }}

    permissions:
      # 需要把生成的文章 commit + push 回 main
      contents: write
      # claude-code-action 运行时需要 status check / 评论等
      pull-requests: write
      issues: write
      id-token: write

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout (拉 .claude/skills 供 Claude 读取 SKILL.md,也是后面
      #    commit/push 的工作区)
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 2. 计算目标日期
      # ------------------------------------------------------------------
      - name: Calculate target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "target_date=${{ github.event.inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            # 北京时间 (UTC+8) 昨天
            # cron 在 UTC 23:00 跑时,北京时间是次日 07:00
            # "昨天" (北京时区) = UTC 今天
            echo "target_date=$(TZ='Asia/Shanghai' date -d 'yesterday' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          fi
          echo "✓ 目标日期: $(cat "$GITHUB_OUTPUT" | grep target_date | cut -d= -f2)"

      # ------------------------------------------------------------------
      # 3. 让 Claude 搜集资讯并把成稿直接写入仓库 Markdown 文件
      # ------------------------------------------------------------------
      - name: Run Claude Code (collect news + write markdown files)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            执行 `.claude/skills/daily-tech-news/SKILL.md` 完成每日技术资讯的搜集与撰写。

            === 运行上下文(注入给 skill) ===

            TARGET_DATE:   ${{ steps.date.outputs.target_date }}
            RUN_MODE:      github-actions-automation

            说明:
            - 本次是 **GitHub Actions 自动化批量产出**,非交互式对话
            - 所有日期派生(文件路径 / date / 标题日期 / cover_label)
              必须基于 TARGET_DATE,禁止使用"今天/昨天"等相对日期

            === 产物契约(必须完全遵守) ===

            成稿是两个 Markdown 文件,用 Write 工具直接写入仓库,**不经过任何
            数据库或 MCP**:

              src/content/posts/daily-tech-news-${{ steps.date.outputs.target_date }}/zh.md
              src/content/posts/daily-tech-news-${{ steps.date.outputs.target_date }}/en.md

            每个文件的 frontmatter(YAML,字符串一律双引号包裹)紧跟在文件开头的
            `---` 之后,字段如下:

            ```yaml
            ---
            title: "每日技术资讯 - 2026年XX月XX日"
            excerpt: "50-150 字摘要,突出 Top 3"
            coverLabel: "XX/XX"
            date: "${{ steps.date.outputs.target_date }}T00:00:00.000Z"
            author: "ai"
            category: "news"
            tags: ["daily-news", "ai"]
            featured: false
            ---
            ```

            frontmatter 后紧跟正文(Markdown 原文,不需要再包一层代码块)。

            === 硬规则 ===

            1. 正文必须是 Phase 4 完整撰写好的中英双语 Markdown 全文(每篇
               ≥ 100 字符、多段结构),**禁止**任何形式的占位符(如
               `placeholder-*`、`TBD`、`TODO`、空字符串)。后面有专门的
               shell 校验 step,写了占位符这次 run 会直接失败,不会提交
               也不会发信 —— 不存在"先占位后回填"的空间,老老实实一次写完。
            2. 两个文件(zh.md / en.md)都必须写,内容独立撰写,不是互译。

            === 执行要求 ===

            严格按 SKILL.md 的 Phase 0-7 顺序执行,**不要跳过任何 Phase**:
              Phase 0: 仓库内近 7 天文章去重基线(Glob + Read)
              Phase 1: 多源 WebSearch + WebFetch
              Phase 2: 交叉验证 + 重要性评分 + 应用 EXCLUDE_LIST
              Phase 3: Top 3 深度分析
              Phase 4: 按模板撰写中英双语完整正文(真正写完,不是写个提纲)
              Phase 5: 用 Write 工具写入上述两个 Markdown 文件
              Phase 6: 发布前自检清单逐项过关
              Phase 7: 输出 "PUBLISHED: <slug>" 结束标志

          claude_args: |
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(date:*)"
            --max-turns 60

      # ------------------------------------------------------------------
      # 4. Verify: 纯 shell 校验产物,不合格直接 fail,后面的提交 / 发信
      #    都不会执行(GitHub Actions 默认逐 step 顺序执行,某 step 失败
      #    整个 job 后续 step 全部跳过)
      # ------------------------------------------------------------------
      - name: Verify generated markdown is complete
        id: verify
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
        run: |
          set -euo pipefail

          SLUG="daily-tech-news-${TARGET_DATE}"
          DIR="src/content/posts/${SLUG}"
          ZH_FILE="${DIR}/zh.md"
          EN_FILE="${DIR}/en.md"

          echo "🔍 校验 ${SLUG}..."

          # 1. 两个文件都必须存在
          for f in "$ZH_FILE" "$EN_FILE"; do
            if [ ! -f "$f" ]; then
              echo "::error title=Daily Tech News verify failed::缺少文件 ${f}"
              exit 1
            fi
          done

          # 2. 逐文件校验 frontmatter 与正文
          for f in "$ZH_FILE" "$EN_FILE"; do
            echo "--- 校验 ${f} ---"

            # frontmatter 必须以 --- 开头,且第二个 --- 分隔正文
            if [ "$(sed -n '1p' "$f")" != "---" ]; then
              echo "::error title=Daily Tech News verify failed::${f} 缺少 frontmatter 起始的 ---"
              exit 1
            fi

            FM_END=$(awk 'NR>1 && /^---$/ {print NR; exit}' "$f")
            if [ -z "$FM_END" ]; then
              echo "::error title=Daily Tech News verify failed::${f} 缺少 frontmatter 结束的 ---"
              exit 1
            fi

            FRONTMATTER=$(sed -n "2,$((FM_END - 1))p" "$f")

            for field in 'title:' 'excerpt:' 'date:'; do
              if ! echo "$FRONTMATTER" | grep -q "^${field}"; then
                echo "::error title=Daily Tech News verify failed::${f} frontmatter 缺少 ${field} 字段"
                exit 1
              fi
            done

            if ! echo "$FRONTMATTER" | grep -q '^category: "news"'; then
              echo "::error title=Daily Tech News verify failed::${f} frontmatter 的 category 必须是 \"news\""
              exit 1
            fi

            # 正文 = frontmatter 结束标记之后的全部内容,去除首尾空白后计字符数
            BODY=$(tail -n "+$((FM_END + 1))" "$f")
            BODY_LEN=$(printf '%s' "$BODY" | tr -d '[:space:]' | wc -c)
            if [ "$BODY_LEN" -lt 100 ]; then
              echo "::error title=Daily Tech News verify failed::${f} 正文字符数 ${BODY_LEN} < 100"
              exit 1
            fi

            # 全文(含 frontmatter)不得含占位符,大小写不敏感
            LOWER=$(tr '[:upper:]' '[:lower:]' < "$f")
            for bad in placeholder tbd todo; do
              if printf '%s' "$LOWER" | grep -q "$bad"; then
                echo "::error title=Daily Tech News verify failed::${f} 含有占位符子串 '${bad}'"
                exit 1
              fi
            done
          done

          echo "✓ ${SLUG} 两个文件均通过校验"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          # 邮件主题用的纯文本标题(中文版)
          echo "title=$(sed -n 's/^title: *"\(.*\)"$/\1/p' "src/content/posts/${SLUG}/zh.md" | head -n1)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 5. Commit & push:校验通过才提交,无变更则跳过后续 step
      # ------------------------------------------------------------------
      - name: Commit and push generated post
        id: commit
        env:
          TARGET_DATE: ${{ steps.date.outputs.target_date }}
          SLUG: ${{ steps.verify.outputs.slug }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "src/content/posts/${SLUG}"

          if git diff --cached --quiet; then
            echo "ℹ️ 没有新增/变更内容,跳过提交"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "feat(news): daily tech news ${TARGET_DATE}"

          # 显式带 token 推送 ——
          # claude-code-action 会用 OIDC 换一个 Claude GitHub App token 覆盖
          # checkout 写入的 http.https://github.com/.extraheader,那个 token 对
          # 本仓库没有 contents:write。
          # extraheader 发出的 Authorization 头会压过 URL 里的 basic 凭据,
          # 所以必须先用空值把它重置掉(git 约定:空字符串 = 清空该头列表),
          # 否则即使 URL 带了 token 也照样 401。
          git -c http.https://github.com/.extraheader= \
            push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

          echo "committed=true" >> "$GITHUB_OUTPUT"
          # deploy job 要构建的是这个新 commit,而不是 workflow 启动时的旧 SHA
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "✓ 已提交并推送 ${SLUG}"

      # 邮件正文在 notify job 里就地从仓库文件读取 —— 长正文塞不进 job outputs
      # (多行值会被折叠,且有大小上限)。

  # ----------------------------------------------------------------------
  # 7. Deploy:复用 deploy.yml 构建并 rsync 到自有服务器
  #    必须显式调用 —— GITHUB_TOKEN 推的 commit 不会触发 deploy.yml 自身的
  #    push 事件(GitHub 的防递归规则)。
  # ----------------------------------------------------------------------
  deploy:
    needs: generate
    if: needs.generate.outputs.committed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.generate.outputs.sha }}
    secrets: inherit

  # ----------------------------------------------------------------------
  # 8. Notify:站点已经上线,邮件里的链接必然可访问,这时才发信
  # ----------------------------------------------------------------------
  notify:
    needs: [generate, deploy]
    if: needs.generate.outputs.committed == 'true'
    runs-on: ubuntu-latest

    steps:
      # 邮件正文直接读仓库里的成稿。不用 job outputs 传正文:多行值会被折叠,
      # 且 outputs 有大小上限,长文必被截断。
      - name: Checkout published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # scripts/build-mail.mjs 把 zh.md 渲染成带内联样式的邮件 HTML。
      # 不能直接把 Markdown 原文塞 <pre> —— 收件人只会看到满屏 ## 和 - 。
      - name: Compose mail body
        env:
          SLUG: ${{ needs.generate.outputs.slug }}
        run: bun scripts/build-mail.mjs --slug "$SLUG" --out mail.html

      # 服务器 / 发件人 / 订阅者名单都放仓库 Variables(Settings → Secrets and
      # variables → Actions → Variables):值可见可改,加订阅者只要编辑
      # MAIL_TO 这一个变量(英文逗号分隔,支持任意多个)。只有账号密码是 Secrets。
      - name: Send notification mail
        # 钉死 commit SHA:第三方 action 能读到 SMTP 凭据,而 `@v4` 是可移动
        # tag,被改写就等于凭据泄露。升级时用
        #   gh api repos/dawidd6/action-send-mail/git/ref/tags/v4 -q .object.sha
        # 重新解析,并人工看一眼 diff。
        uses: dawidd6/action-send-mail@611879133a9569642c41be66f4a323286e9b8a3b # v4
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          # 465 = 隐式 TLS(secure);587 / 25 = STARTTLS,action 会自行升级连接。
          # 写死 true 会让 587 直接连不上,所以按端口判定。
          secure: ${{ vars.SMTP_PORT == '465' }}
          from: ZerxLab <${{ vars.MAIL_FROM }}>
          # To 只写发件人自己,订阅者一律走 bcc ——
          # 否则每个人都能在收件人栏看到整份名单,转发一次就全泄了。
          to: ZerxLab <${{ vars.MAIL_FROM }}>
          # 订阅者名单,英文逗号分隔。163 单封信收件人数有上限且群发易触发
          # 反垃圾,名单上到几十人就该换邮件列表别名或逐封发送。
          bcc: ${{ vars.MAIL_TO }}
          subject: "[ZerxLab] 新资讯已发布: ${{ needs.generate.outputs.title }}"
          html_body: file://mail.html
